version: v2
plugins:
  - local: ../bin/protoc-gen-go
    out: gen/go
    opt:
      - paths=source_relative

  - local: ../bin/protoc-gen-go-grpc
    out: gen/go
    opt:
      - paths=source_relative
managed:
  enabled: true
  override:
    - file_option: go_package_prefix
      value: github.com/KlementevTech/gotips/api/gen/go